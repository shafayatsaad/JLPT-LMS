name: Quality gate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit

      - name: Lint application and tests
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run production browser smoke tests
        run: npm run test:e2e

      - name: Upload browser failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  database-migrations:
    name: Replay Supabase migrations locally
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.3.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Replay every migration from a clean local database
        run: supabase db reset --local --no-seed

      - name: Run database security and policy tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
