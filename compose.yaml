services:
  app:
    image: jlpt-lms-local-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Run npm run demo:local:docker to prepare local Supabase values}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Run npm run demo:local:docker to prepare local Supabase values}
        NEXT_PUBLIC_AUTH_ENABLE_PHONE: ${NEXT_PUBLIC_AUTH_ENABLE_PHONE:-true}
        NEXT_PUBLIC_DEMO_LAN_ENABLED: ${NEXT_PUBLIC_DEMO_LAN_ENABLED:-false}
    env_file:
      - .local-demo/compose.env
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
      SUPABASE_INTERNAL_URL: http://host.docker.internal:54321
      LOCAL_DEMO_ACCOUNTS_ENABLED: "true"
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${JLPT_DEMO_BIND_ADDRESS:-127.0.0.1}:3002:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
